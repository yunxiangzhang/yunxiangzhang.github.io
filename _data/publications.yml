# Publications, newest first. Fields:
#   title    (required)
#   authors  (required) list of names; append "*" for equal contribution.
#            Your own name (author.name in _config.yml) is bolded, and names
#            listed in people.yml are linked to their homepages.
#   venue    (required)
#   image    thumbnail path (~480 px wide, see scripts/make-thumbnail.sh), or
#   video    looping silent MP4 thumbnail (set `image` too, as its poster)
#   links    any of: paper, project, video, code. The title links to the
#            project page if present, otherwise to the paper.
#   paper_label  optional text for the paper link (default "Paper")
#   badges   optional highlight tags: { text, icon, url, style: award|press }

